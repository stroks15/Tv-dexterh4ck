name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run validate:plugins
      - run: npm run build:roku
      - uses: actions/upload-artifact@v4
        with:
          name: tv-dexterh4ck-roku-channel
          path: dist/tv-dexterh4ck-roku.zip
          if-no-files-found: error
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://yxjyqpnvgtkdaaukackt.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: https://yxjyqpnvgtkdaaukackt.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
